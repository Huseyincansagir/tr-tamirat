  <g id="text_38">
   <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="7.9488" y="16.873828" transform="rotate(-0 7.9488 16.873828)">Aynı tutarda gelir, türüne göre çok farklı vergileniyor (2026)</text>
  </g>
  <g id="text_39">
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(7.9488 35.462687)">Gelir vergisi + damga vergisinin brüt gelire oranı. Ücrette işçi primleri (%15) hariç; kira örneği başka geliri olmayan kişi, 58.000 TL</text>
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(7.9488 46.22825)">istisna ve %15 götürü gider.</text>
  </g>
  <g id="text_40">
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #8a8984" transform="translate(7.9488 372.536213)">Kaynak: GİB 2026 gelir vergisi tarifesi, konut kira istisnası, GVK 94 ve Geçici md. 67 kesinti oranları (hesap: 05_ANALIZ/kod/ekonomi_veri.py). Faizde oran</text>
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #8a8984" transform="translate(7.9488 381.44115)">nominal getiriye uygulanır; reel getiriye oranla etkin yük daha yüksektir.</text>
  </g>
