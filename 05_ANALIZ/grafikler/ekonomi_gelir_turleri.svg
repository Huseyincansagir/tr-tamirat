  </g>
  <g id="text_29">
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #8a8984" transform="translate(9.072 308.513813)">Kaynak: TÜİK SDMX DF_KURUMSAL_SEKTOR_HESAPLARI_CARI_FIYATLARLA_V2 (S1M; D1, B2A3G, D4, D62 alacak); TÜİK Gelir Dağılımı İstatistikleri 2025 (basın aktarımı); 'diğer' kalan olarak</text>
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #8a8984" transform="translate(9.072 317.41875)">hesaplandı.</text>
