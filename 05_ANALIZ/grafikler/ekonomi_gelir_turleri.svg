  <g id="text_28">
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(9.072 34.899625)">Ulusal hesaplarda birincil gelir ve sosyal yardımların bileşimi. Mülk geliri içinde faizin payı 2020'den sonra arttı (%3 → %8). Sağ: GYKA 2025 anketinde</text>
